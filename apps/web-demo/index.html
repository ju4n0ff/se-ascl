<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FAFAF8" />
  <meta name="description" content="SeñasCL — Intérprete de Lengua de Señas Chilena en tiempo real" />
  <title>SeñasCL — Intérprete LSCh</title>

  <!-- Nunito - Humanist sans-serif, warm and rounded -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
      background: #FAFAF8;
      color: #1A1A1A;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #root {
      min-height: 100vh;
    }

    /* Focus visible for keyboard navigation */
    :focus-visible {
      outline: 2px solid #E8725C;
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #D1CEC9;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #9B9B9B;
    }

    /* Selection */
    ::selection {
      background: rgba(232, 114, 92, 0.2);
      color: #1A1A1A;
    }

    /* Reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
